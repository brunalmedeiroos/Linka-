<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Baloo+2:wght@700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:100%; height:100%; min-height:900px; background:#F7F8FA; display:flex; flex-direction:column; align-items:center; position:relative; overflow:hidden;">

  <svg style="position:absolute; left:-60px; top:60px; opacity:0.06;" width="180" height="180" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="5.2" stroke="{{accent}}" stroke-width="1.4"/><circle cx="15" cy="15" r="5.2" stroke="{{accent}}" stroke-width="1.4"/></svg>
  <svg style="position:absolute; right:-40px; bottom:-40px; opacity:0.06;" width="220" height="220" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="5.2" stroke="{{accent}}" stroke-width="1.4"/><circle cx="15" cy="15" r="5.2" stroke="{{accent}}" stroke-width="1.4"/></svg>

  <!-- header -->
  <div style="width:100%; display:flex; align-items:center; justify-content:space-between; padding:28px 48px; z-index:1;">
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-family:'Baloo 2', sans-serif; font-weight:800; font-size:21px; color:{{accent}};">link</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="5.2" stroke="{{accent}}" stroke-width="2.4"/><circle cx="15" cy="15" r="5.2" stroke="{{accent}}" stroke-width="2.4"/></svg>
      <span style="font-family:'Baloo 2', sans-serif; font-weight:800; font-size:21px; color:{{accent}};">aê</span>
    </div>

    <div style="display:flex; align-items:center; gap:10px;">
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:20px; height:20px; border-radius:50%; background:{{accent}}; display:flex; align-items:center; justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span style="font-size:12px; font-weight:700; color:{{accent}};">Cadastro</span>
      </div>
      <div style="width:24px; height:1.5px; background:{{accent}};"></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:20px; height:20px; border-radius:50%; background:{{accent}}; display:flex; align-items:center; justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span style="font-size:12px; font-weight:700; color:{{accent}};">Pagamento</span>
      </div>
      <div style="width:24px; height:1.5px; background:{{accent}};"></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:20px; height:20px; border-radius:50%; background:{{accent}}; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:#fff;">3</div>
        <span style="font-size:12px; font-weight:700; color:{{accent}};">Bem-vindo</span>
      </div>
    </div>
  </div>

  <!-- content -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; z-index:1; text-align:center;">

    <div style="width:88px; height:88px; border-radius:50%; background:#F5F7FF; border:1px solid #DCE1F5; display:flex; align-items:center; justify-content:center;">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="5.4" stroke="{{accent}}" stroke-width="2.2"/><circle cx="15" cy="15" r="5.4" stroke="{{accent}}" stroke-width="2.2"/></svg>
    </div>

    <div>
      <div style="font-size:36px; font-weight:800; color:#14151B; letter-spacing:-0.01em;">Bem-vindo ao Linkaê, Marina!</div>
      <div style="font-size:15px; color:#6B7080; margin-top:14px; max-width:420px;">Sua conta foi criada com sucesso. Agora vamos deixar sua vitrine com a sua cara.</div>
    </div>

    <button style="background:{{accent}}; color:#FFFFFF; border:none; padding:16px 34px; border-radius:13px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:0 16px 32px -14px rgba(1,21,173,0.5);">Começar</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0115AD","options":["#0115AD","#1830C4","#0A0F7A"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0115AD' };
  }
}
</script>
</body>
</html>
