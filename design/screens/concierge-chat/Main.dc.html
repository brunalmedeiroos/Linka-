<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:100%; height:100%; background:#33121C; display:flex; flex-direction:column;">

  <!-- header -->
  <div style="display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0;">
    <div style="width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#F0E4DC" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div style="width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); display:flex; align-items:center; justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5 5 1.6-5 1.6-1.6 5-1.6-5-5-1.6 5-1.6L12 3z" stroke="#33121C" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div style="font-size:13.5px; font-weight:700; color:#F5EDE4;">Assistente da Marina</div>
      <div style="font-size:10.5px; color:#C9AFAF;">Assistente virtual</div>
    </div>
  </div>

  <!-- thread -->
  <div style="flex:1; padding:20px; display:flex; flex-direction:column; gap:22px; overflow:hidden;">

    <!-- Q1: answered -->
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; gap:9px; align-items:flex-start;">
        <div style="width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5 5 1.6-5 1.6-1.6 5-1.6-5-5-1.6 5-1.6L12 3z" stroke="#33121C" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
        <div style="background:#3E1826; border-radius:14px; border-bottom-left-radius:4px; padding:11px 14px; max-width:240px;">
          <div style="font-size:12.5px; color:#F5EDE4; line-height:1.5;">Olá! O que você procura?</div>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:7px; padding-left:35px;">
        <div style="padding:7px 13px; border-radius:999px; background:{{accent}}; color:#33121C; font-size:11.5px; font-weight:700;">Quero contratar</div>
        <div style="padding:7px 13px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); color:#8A7A78; font-size:11.5px; font-weight:600;">Quero comprar</div>
        <div style="padding:7px 13px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); color:#8A7A78; font-size:11.5px; font-weight:600;">Conhecer o trabalho</div>
        <div style="padding:7px 13px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); color:#8A7A78; font-size:11.5px; font-weight:600;">Sou creator</div>
        <div style="padding:7px 13px; border-radius:999px; border:1px solid rgba(255,255,255,0.14); color:#8A7A78; font-size:11.5px; font-weight:600;">Outro</div>
      </div>
    </div>

    <!-- Q2: active -->
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; gap:9px; align-items:flex-start;">
        <div style="width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5 5 1.6-5 1.6-1.6 5-1.6-5-5-1.6 5-1.6L12 3z" stroke="#33121C" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
        <div style="background:#3E1826; border-radius:14px; border-bottom-left-radius:4px; padding:11px 14px; max-width:240px;">
          <div style="font-size:12.5px; color:#F5EDE4; line-height:1.5;">Você procura algo para começar ou já trabalha com isso?</div>
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:7px; padding-left:35px;">
        <div style="padding:8px 15px; border-radius:999px; border:1.4px solid rgba(232,199,122,0.5); color:#F5EDE4; font-size:12px; font-weight:600;">Estou começando</div>
        <div style="padding:8px 15px; border-radius:999px; border:1.4px solid rgba(232,199,122,0.5); color:#F5EDE4; font-size:12px; font-weight:600;">Já trabalho com isso</div>
        <div style="padding:8px 15px; border-radius:999px; border:1.4px solid rgba(232,199,122,0.5); color:#F5EDE4; font-size:12px; font-weight:600;">Outro</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A15E","options":["#D9A15E","#E8C77A","#C9536B"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9A15E' };
  }
}
</script>
</body>
</html>
