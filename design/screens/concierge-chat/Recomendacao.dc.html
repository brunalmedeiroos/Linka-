<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:100%; height:100%; background:#33121C; display:flex; flex-direction:column;">

  <!-- header -->
  <div style="display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0;">
    <div style="width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#F0E4DC" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div style="width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); display:flex; align-items:center; justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5 5 1.6-5 1.6-1.6 5-1.6-5-5-1.6 5-1.6L12 3z" stroke="#33121C" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div style="font-size:13.5px; font-weight:700; color:#F5EDE4;">Assistente da Marina</div>
      <div style="font-size:10.5px; color:#C9AFAF;">Assistente virtual</div>
    </div>
  </div>

  <!-- thread -->
  <div style="flex:1; padding:20px; display:flex; flex-direction:column; gap:16px; overflow:hidden;">

    <!-- condensed history -->
    <div style="display:flex; flex-direction:column; gap:8px; opacity:0.4;">
      <div style="display:flex; gap:9px; align-items:center;">
        <div style="width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); flex-shrink:0;"></div>
        <div style="font-size:11px; color:#C9AFAF;">O que você procura? → <span style="color:#F5EDE4; font-weight:600;">Quero contratar</span></div>
      </div>
      <div style="display:flex; gap:9px; align-items:center;">
        <div style="width:20px; height:20px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); flex-shrink:0;"></div>
        <div style="font-size:11px; color:#C9AFAF;">Começando ou já atua? → <span style="color:#F5EDE4; font-weight:600;">Estou começando</span></div>
      </div>
    </div>

    <!-- final message -->
    <div style="display:flex; gap:9px; align-items:flex-start;">
      <div style="width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#E8C77A,#C9536B); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 5 5 1.6-5 1.6-1.6 5-1.6-5-5-1.6 5-1.6L12 3z" stroke="#33121C" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <div style="background:#3E1826; border-radius:14px; border-bottom-left-radius:4px; padding:11px 14px; max-width:260px;">
        <div style="font-size:12.5px; color:#F5EDE4; line-height:1.5;">Entendi! Acho que isso pode fazer sentido pra você:</div>
      </div>
    </div>

    <!-- recommendation card -->
    <div style="margin-left:35px; background:#F3ECE3; border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px;">
      <div style="width:100%; height:110px; border-radius:13px; background:linear-gradient(135deg,#D9A15E,#8E4A55);"></div>
      <div>
        <div style="font-size:14px; font-weight:700; color:#33121C;">Creators Club</div>
        <div style="font-size:11.5px; font-weight:700; color:{{accent}}; margin-top:2px;">R$497</div>
      </div>
      <div style="font-size:11.5px; color:#7A6A55; line-height:1.5;">Porque foi criado pra quem está começando a estruturar conteúdo e primeiras parcerias.</div>
      <button style="width:100%; background:#33121C; color:#F5EDE4; border:none; padding:12px; border-radius:11px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
        Conhecer produto
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#F5EDE4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A15E","options":["#D9A15E","#E8C77A","#C9536B"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9A15E' };
  }
}
</script>
</body>
</html>
