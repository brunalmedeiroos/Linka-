<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Baloo+2:wght@600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; }
    a { color: #0115AD; text-decoration: none; }
    a:hover { color: #0A0F7A; }
  </style>
</helmet>

<div style="width:100%; height:100%; min-height:900px; background:#FBFBFD; display:flex; flex-direction:column; padding:48px 64px; position:relative; overflow:hidden;">

  <!-- decorative elo watermark -->
  <svg style="position:absolute; right:-40px; bottom:-40px; opacity:0.05;" width="260" height="260" viewBox="0 0 24 24" fill="none">
    <circle cx="9" cy="9" r="5.2" stroke="{{accent}}" stroke-width="1.6"/>
    <circle cx="15" cy="15" r="5.2" stroke="{{accent}}" stroke-width="1.6"/>
  </svg>

  <!-- header -->
  <div style="display:flex; align-items:center; justify-content:space-between; z-index:1;">
    <div style="display:flex; align-items:center; gap:4px;">
      <span style="font-family:'Baloo 2', 'Montserrat', sans-serif; font-weight:700; font-size:22px; color:{{accent}}; letter-spacing:-0.01em;">link</span>
      <span style="position:relative; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="9" cy="9" r="5.2" stroke="{{accent}}" stroke-width="2.2"/>
          <circle cx="15" cy="15" r="5.2" stroke="{{accent}}" stroke-width="2.2"/>
        </svg>
      </span>
      <span style="font-family:'Baloo 2', 'Montserrat', sans-serif; font-weight:700; font-size:22px; color:{{accent}}; letter-spacing:-0.01em;">aê</span>
    </div>

    <div style="display:flex; align-items:center; gap:10px; cursor:pointer;">
      <div style="width:40px; height:40px; border-radius:50%; background:#DDE1E7; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:{{accent}};">M</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M6 9l6 6 6-6" stroke="#8A8F9C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- main -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; z-index:1;">

    <div style="text-align:center;">
      <div style="font-size:38px; font-weight:700; color:#14151B; letter-spacing:-0.02em; margin-bottom:14px;">Oii, Marina!</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:8px; font-size:17px; font-weight:500; color:#3D414C;">
        <span style="width:8px; height:8px; border-radius:50%; background:#1E9E6B; display:inline-block;"></span>
        Sua vitrine está publicada
      </div>
      <div style="font-size:14px; color:#9297A3; margin-top:6px; letter-spacing:0.01em;">linkae.com/@marina</div>
    </div>

    <!-- phone preview -->
    <div style="width:250px; height:440px; border-radius:30px; background:#F3F4F7; border:1px solid #E5E8EE; box-shadow:0 24px 48px -20px rgba(1,21,173,0.22); padding:20px 18px; display:flex; flex-direction:column; align-items:center; gap:10px; position:relative; cursor:pointer;">

      <svg style="position:absolute; top:16px; right:16px; opacity:0.55;" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M4 14v6h6M20 10V4h-6M20 4l-7 7M4 20l7-7" stroke="#5A5F6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <div style="width:56px; height:56px; border-radius:50%; background:#DDE1E7; display:flex; align-items:center; justify-content:center; margin-top:6px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3.4" stroke="{{accent}}" stroke-width="1.8"/>
          <path d="M5 20c1.4-3.6 4.2-5.4 7-5.4s5.6 1.8 7 5.4" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="font-weight:700; font-size:13px; color:#14151B;">Marina Silva</div>
      <div style="font-size:10.5px; color:#8A8F9C; margin-bottom:6px;">Criadora de conteúdo · UGC</div>

      <div style="width:100%; display:flex; flex-direction:column; gap:7px;">
        <div style="display:flex; align-items:center; gap:8px; background:#FFFFFF; border:1px solid #E5E8EE; border-radius:10px; padding:8px 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke="#5A5F6C" stroke-width="1.8"/><circle cx="12" cy="12" r="3.2" stroke="#5A5F6C" stroke-width="1.8"/></svg>
          <span style="font-size:11px; font-weight:600; color:#2B2E36;">Instagram</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; background:#FFFFFF; border:1px solid #E5E8EE; border-radius:10px; padding:8px 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 19l1.4-3.8A7 7 0 1112 19a7 7 0 01-3.6-1L5 19z" stroke="#5A5F6C" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span style="font-size:11px; font-weight:600; color:#2B2E36;">WhatsApp</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; background:#FFFFFF; border:1px solid #E5E8EE; border-radius:10px; padding:8px 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 8a2 2 0 012-2h12a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z" stroke="#5A5F6C" stroke-width="1.8"/><path d="M9 6V5a2 2 0 012-2h2a2 2 0 012 2v1" stroke="#5A5F6C" stroke-width="1.8"/></svg>
          <span style="font-size:11px; font-weight:600; color:#2B2E36;">Meu Portfólio</span>
        </div>
      </div>

      <div style="width:100%; margin-top:4px; position:relative; overflow:hidden; height:56px;">
        <div style="display:flex; gap:7px; position:absolute; left:0; top:0;">
          <div style="width:64px; height:56px; border-radius:9px; background:#FFFFFF; border:1px solid #E5E8EE; display:flex; flex-direction:column; padding:6px;">
            <div style="flex:1; background:#E9EBF0; border-radius:5px;"></div>
            <div style="font-size:8px; font-weight:700; color:{{accent}}; margin-top:3px;">R$97</div>
          </div>
          <div style="width:64px; height:56px; border-radius:9px; background:#FFFFFF; border:1px solid #E5E8EE; display:flex; flex-direction:column; padding:6px;">
            <div style="flex:1; background:#E9EBF0; border-radius:5px;"></div>
            <div style="font-size:8px; font-weight:700; color:{{accent}}; margin-top:3px;">R$47</div>
          </div>
          <div style="width:64px; height:56px; border-radius:9px; background:#FFFFFF; border:1px solid #E5E8EE; display:flex; flex-direction:column; padding:6px;">
            <div style="flex:1; background:#E9EBF0; border-radius:5px;"></div>
            <div style="font-size:8px; font-weight:700; color:{{accent}}; margin-top:3px;">R$150</div>
          </div>
        </div>
        <div style="position:absolute; right:0; top:0; width:28px; height:56px; background:linear-gradient(90deg, rgba(243,244,247,0), #F3F4F7);"></div>
      </div>
    </div>

    <div style="display:flex; gap:14px;">
      <button style="background:{{accent}}; color:#FFFFFF; border:none; padding:14px 30px; border-radius:12px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer; box-shadow:0 10px 20px -8px rgba(1,21,173,0.45);">Editar vitrine</button>
      <button style="background:transparent; color:#14151B; border:1.5px solid #DDE1E7; padding:14px 30px; border-radius:12px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer;">Ver Analytics</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#0115AD","options":["#0115AD","#1830C4","#0A0F7A"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0115AD' };
  }
}
</script>
</body>
</html>
