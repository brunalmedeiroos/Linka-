<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; }
    a { color: #E8C77A; text-decoration: none; }
    a:hover { color: #F3D89A; }
    ::placeholder { color: #A8909A; }
  </style>
</helmet>

<div style="width:100%; height:100%; background:#33121C; position:relative; overflow:hidden;">

  <!-- dimmed vitrine behind -->
  <div style="padding:40px 22px; display:flex; flex-direction:column; align-items:center; filter:blur(1.5px); opacity:0.5;">
    <div style="width:112px; height:112px; border-radius:50%; padding:4px; background:linear-gradient(135deg, #E8C77A, #D9A15E, #C9536B); display:flex; align-items:center; justify-content:center;">
      <div style="width:100%; height:100%; border-radius:50%; background:#4A2530; display:flex; align-items:center; justify-content:center; border:3px solid #33121C;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="#E8C77A" stroke-width="1.6"/><path d="M5 20c1.4-3.8 4.2-5.6 7-5.6s5.6 1.8 7 5.6" stroke="#E8C77A" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div style="font-size:11px; font-weight:700; letter-spacing:0.14em; color:{{accent}}; margin-top:18px;">CRIADORA DE CONTEÚDO</div>
    <div style="font-family:'Playfair Display', serif; font-size:30px; font-weight:700; color:#F5EDE4; margin-top:8px;">Marina Silva</div>
    <div style="font-size:13.5px; color:#C9AFAF; line-height:1.6; text-align:center; margin-top:10px; max-width:280px;">
      Ajudo marcas a criar conteúdo que <span style="color:{{accent}}; font-weight:600;">conecta e vende</span>.
    </div>
  </div>

  <!-- scrim -->
  <div style="position:absolute; inset:0; background:rgba(20,7,11,0.72); display:flex; align-items:center; justify-content:center; padding:22px;">

    <!-- modal -->
    <div style="width:100%; max-width:330px; background:#FBF6EF; border-radius:22px; padding:26px 22px 24px; position:relative; box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);">

      <div style="position:absolute; top:16px; right:16px; width:26px; height:26px; border-radius:50%; background:#EFE4D5; display:flex; align-items:center; justify-content:center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#7A6A55" stroke-width="2" stroke-linecap="round"/></svg>
      </div>

      <div style="font-family:'Playfair Display', serif; font-size:19px; font-weight:700; color:#33121C; margin-bottom:6px; padding-right:20px;">Vamos conversar?</div>
      <div style="font-size:12px; color:#7A6A55; line-height:1.5; margin-bottom:18px;">Deixe seus dados que a Marina retorna o contato.</div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <input placeholder="Nome" style="width:100%; padding:12px 14px; border-radius:11px; border:1px solid #E3D6C4; background:#FFFFFF; font-family:'Montserrat',sans-serif; font-size:12.5px; color:#33121C;" />
        <input placeholder="Empresa (opcional)" style="width:100%; padding:12px 14px; border-radius:11px; border:1px solid #E3D6C4; background:#FFFFFF; font-family:'Montserrat',sans-serif; font-size:12.5px; color:#33121C;" />
        <input placeholder="E-mail" style="width:100%; padding:12px 14px; border-radius:11px; border:1px solid #E3D6C4; background:#FFFFFF; font-family:'Montserrat',sans-serif; font-size:12.5px; color:#33121C;" />
        <input placeholder="WhatsApp" style="width:100%; padding:12px 14px; border-radius:11px; border:1px solid #E3D6C4; background:#FFFFFF; font-family:'Montserrat',sans-serif; font-size:12.5px; color:#33121C;" />
        <textarea placeholder="Briefing (opcional)" rows="2" style="width:100%; padding:12px 14px; border-radius:11px; border:1px solid #E3D6C4; background:#FFFFFF; font-family:'Montserrat',sans-serif; font-size:12.5px; color:#33121C; resize:none;"></textarea>
      </div>

      <button style="width:100%; margin-top:16px; background:{{accent}}; color:#33121C; border:none; padding:13px; border-radius:12px; font-family:'Montserrat',sans-serif; font-weight:700; font-size:13px; cursor:pointer;">Enviar</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D9A15E","options":["#D9A15E","#E8C77A","#C9536B"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9A15E' };
  }
}
</script>
</body>
</html>
