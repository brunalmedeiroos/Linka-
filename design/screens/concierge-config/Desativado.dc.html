<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:100%; height:100%; min-height:900px; background:#FFFFFF; display:flex; flex-direction:column; position:relative; overflow:hidden;">

  <!-- header -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:0 32px; height:76px; min-height:76px; border-bottom:1px solid #EDEEF2;">
    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:36px; height:36px; border-radius:10px; background:#F0F1F4; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="#4B4F5A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div style="font-weight:700; font-size:16px; color:#14151B;">Concierge IA</div>
        <div style="font-size:11.5px; color:#9297A3;">Vitrine de Marina</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:20px;">
      <div style="display:flex; align-items:center; gap:9px;">
        <span style="font-size:12.5px; font-weight:600; color:#9297A3;">Desativado</span>
        <div style="width:38px; height:22px; border-radius:999px; background:#E0E2E8; position:relative; padding:2px;">
          <div style="width:18px; height:18px; border-radius:50%; background:#fff;"></div>
        </div>
      </div>
      <button style="background:#F0F1F4; color:#B4B8C2; border:none; padding:10px 22px; border-radius:11px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px;">Salvar</button>
    </div>
  </div>

  <!-- empty state -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; max-width:420px; margin:0 auto; text-align:center;">
    <div style="width:76px; height:76px; border-radius:50%; background:#F0F1F4; display:flex; align-items:center; justify-content:center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.8 5.6L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.4L12 3z" stroke="#B4B8C2" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div style="font-size:19px; font-weight:700; color:#14151B; margin-bottom:8px;">O Concierge está desativado</div>
      <div style="font-size:13.5px; color:#9297A3; line-height:1.6;">Ative para configurar as perguntas e deixar a IA recomendar seus produtos aos visitantes.</div>
    </div>
    <button style="background:#0115AD; color:#FFFFFF; border:none; padding:13px 26px; border-radius:12px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; box-shadow:0 8px 16px -8px rgba(1,21,173,0.45);">Ativar Concierge</button>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
